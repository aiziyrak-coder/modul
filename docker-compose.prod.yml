# Loyiha nomi: modul  (serverda noyob)
name: modul

x-log: &log
  driver: "json-file"
  options: { max-size: "20m", max-file: "5" }

services:
  mongo:
    image: mongo:4.4   # serverda AVX yo'q: 5.0+ ishlamaydi
    restart: unless-stopped
    # ports: YO'Q — faqat ichki tarmoq
    volumes:
      - modul_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *log

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - modul_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
    logging: *log

  # Yuz vektori xizmati (InsightFace buffalo_l, cam.fermi.uz bilan bir xil model). Faqat ichki tarmoq.
  # Image iMentor'dan tayyor; kod deploy/face_service da, modellar o'z hajmimizda
  # (birinchi ishga tushishda yuklanadi). root: yangi hajmga yozish uchun.
  face:
    image: imentor-face-base:20260917
    working_dir: /srv
    user: "0"
    command: ["python", "-m", "uvicorn", "face_service.main:app", "--host", "0.0.0.0", "--port", "8200", "--workers", "1"]
    restart: unless-stopped
    environment:
      OMP_NUM_THREADS: "2"
      FACE_MAX_PARALLEL: "6"
      FACE_DET_SIZE: "640"
    volumes:
      - ./deploy/face_service:/srv/face_service:ro
      - modul_face_models:/root/.insightface
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request,sys; sys.exit(0 if json.load(urllib.request.urlopen('http://127.0.0.1:8200/health', timeout=4)).get('ok') else 1)"]
      interval: 20s
      timeout: 6s
      retries: 6
      start_period: 120s
    logging: *log

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.main
    restart: unless-stopped
    env_file: ./env/main.env
    volumes:
      - ./env/main.env:/app/.env:ro
      - modul_uploads:/app/uploads
      - modul_private:/app/private
      - modul_api_logs:/app/logs
    ports:
      - "127.0.0.1:9220:4000"
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    logging: *log

  listener:
    build:
      context: .
      dockerfile: deploy/Dockerfile.listener
    restart: unless-stopped
    env_file: ./env/listener.env
    ports:
      - "127.0.0.1:9221:4500"
    depends_on:
      mongo: { condition: service_healthy }
      api: { condition: service_started }
    logging: *log

volumes:
  modul_mongo_data:
  modul_redis_data:
  modul_uploads:
  modul_private:
  modul_api_logs:
  modul_face_models:
