# Loyiha nomi: modul  (serverda noyob)
name: modul

x-log: &log
  driver: "json-file"
  options: { max-size: "20m", max-file: "5" }

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # ports: YO'Q — faqat ichki tarmoq
    volumes:
      - modul_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *log

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - modul_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
    logging: *log

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.main
    restart: unless-stopped
    env_file: ./env/main.env
    volumes:
      - ./env/main.env:/app/.env:ro
      - modul_uploads:/app/uploads
      - modul_private:/app/private
      - modul_api_logs:/app/logs
    ports:
      - "127.0.0.1:9220:4000"
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    logging: *log

  listener:
    build:
      context: .
      dockerfile: deploy/Dockerfile.listener
    restart: unless-stopped
    env_file: ./env/listener.env
    ports:
      - "127.0.0.1:9221:4500"
    depends_on:
      mongo: { condition: service_healthy }
      api: { condition: service_started }
    logging: *log

volumes:
  modul_mongo_data:
  modul_redis_data:
  modul_uploads:
  modul_private:
  modul_api_logs:
